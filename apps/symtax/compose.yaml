services:
  symtax-mongo:
    image: mongo:8.0.4
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - '0.25'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SYMTAX_MONGO_ROOT_USERNAME:?set a local SymTax MongoDB root username}
      MONGO_INITDB_ROOT_PASSWORD: ${SYMTAX_MONGO_ROOT_PASSWORD:?set a local SymTax MongoDB root password}
      MONGO_INITDB_DATABASE: symtax
      SYMTAX_MONGO_APP_USERNAME: ${SYMTAX_MONGO_APP_USERNAME:?set a local SymTax MongoDB application username}
      SYMTAX_MONGO_APP_PASSWORD: ${SYMTAX_MONGO_APP_PASSWORD:?set a local SymTax MongoDB application password}
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - symtax-mongo-data:/data/db
      - ./docker/mongo/init-app-user.js:/docker-entrypoint-initdb.d/10-init-app-user.js:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'db.adminCommand({ ping: 1 }).ok'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  symtax-mongo-data:
